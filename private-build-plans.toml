[buildPlans.MyIosevkaFixed]
family = "MyIosevka Fixed"
spacing = "fixed"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.MyIosevkaFixed.variants.design]
one = "base"
capital-g = "toothless-rounded-serifless-hooked"
capital-i = "serifed"
f = "flat-hook-serifless"
t = "flat-hook"
u = "toothless-rounded-serifless"
punctuation-dot = "square"
asterisk = "hex-high"
ascii-single-quote = "straight"
paren = "normal"
at = "fourfold"
percent = "rings-continuous-slash"
question = "corner"

[buildPlans.MyIosevkaFixed.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.MyIosevkaFixed.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.MyIosevkaFixed.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.MyIosevkaFixed.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.MyIosevkaFixed.widths.Extended]
shape = 600
menu = 7
css = "expanded"

[buildPlans.MyIosevkaFixed.widths.SemiExtended]
shape = 548
menu = 6
css = "semi-expanded"

[buildPlans.MyIosevkaFixed.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.MyIosevkaFixed.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
